<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div class="tasks_creation">
            <div class="add_task">
                <p>Add Task</p>
                <i class="ri-add-circle-line add"></i>
            </div>
        </div>

        <div class="main">

            <div class="Searching_tab">
                <input type="text" placeholder="Search your task here" id="task_search">
                <i class="ri-search-eye-line search_icon"></i>

            </div>
            <div class="task_list">
               
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
